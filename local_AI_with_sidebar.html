<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nano - Multi-Chat Edition</title>
    <style>
        :root { --sidebar-width: 260px; }
        body { font-family: sans-serif; background: #f4f4f9; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: var(--sidebar-width); background: #202123; color: white; display: flex; flex-direction: column; padding: 10px; }
        #new-chat-btn { background: #34a853; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        
        .chat-item-wrapper { display: flex; align-items: center; border-radius: 5px; cursor: pointer; border: 1px solid transparent; position: relative; }
        .chat-item-wrapper:hover { background: #343541; }
        .chat-item-wrapper.active { background: #343541; border-color: #34a853; }
        .chat-item-title { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 10px; }
        
        .delete-btn { opacity: 0; color: #888; padding: 5px 10px; font-size: 18px; transition: opacity 0.2s; }
        .chat-item-wrapper:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #ff4d4d; }

        #clear-all-btn { background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 12px; transition: 0.2s; }
        #clear-all-btn:hover { background: #ff4d4d; color: white; }

        /* Main Area */
        #main { flex: 1; display: flex; flex-direction: column; background: #fff; }
        header { padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .ai { align-self: flex-start; background: #e9e9eb; color: #333; white-space: pre-wrap; }
        
        #input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .btn-primary { background: #34a853; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-outline { background: transparent; color: #555; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div id="sidebar">
    <button id="new-chat-btn">+ New Chat</button>
    <div id="chat-list"></div>
    <button id="clear-all-btn">🗑 Clear All History</button>
</div>

<div id="main">
    <header>
        <div>
            <strong id="chat-title">New Conversation</strong><br>
            <small id="status" style="color: #888;">Initializing...</small>
        </div>
        <button id="exportBtn" class="btn-outline">Download (.txt)</button>
    </header>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" class="btn-primary" disabled>Send</button>
    </div>
</div>

<script>
    let session;
    let currentChatId = null;
    let allChats = JSON.parse(localStorage.getItem('gemini_sessions')) || {};

    const chatList = document.getElementById('chat-list');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatTitle = document.getElementById('chat-title');
    const exportBtn = document.getElementById('exportBtn');
    const clearAllBtn = document.getElementById('clear-all-btn');

    async function init() {
        try {
            session = await LanguageModel.create({
                systemPrompt: "Your name is Gemini Nano. You are a local AI assistant. Be helpful and concise.",
                expectedValue: { outputLanguage: 'en' }
            });
            document.getElementById('status').textContent = "Model Online";
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            renderSidebar();
            const ids = Object.keys(allChats);
            if (ids.length > 0) loadChat(ids[ids.length - 1]);
            else startNewChat();
        } catch (e) { document.getElementById('status').textContent = "Error: Check chrome://flags"; }
    }

    function renderSidebar() {
        chatList.innerHTML = '';
        Object.keys(allChats).sort().reverse().forEach(id => {
            const wrapper = document.createElement('div');
            wrapper.className = `chat-item-wrapper ${id === currentChatId ? 'active' : ''}`;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'chat-item-title';
            titleSpan.textContent = allChats[id].title || "Untitled Chat";
            titleSpan.onclick = () => loadChat(id);
            
            const delBtn = document.createElement('span');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteChat(id);
            };
            
            wrapper.appendChild(titleSpan);
            wrapper.appendChild(delBtn);
            chatList.appendChild(wrapper);
        });
    }

    function deleteChat(id) {
        if (!confirm("Delete this conversation?")) return;
        delete allChats[id];
        save();
        if (id === currentChatId) {
            const remainingIds = Object.keys(allChats);
            if (remainingIds.length > 0) loadChat(remainingIds[remainingIds.length - 1]);
            else startNewChat();
        } else { renderSidebar(); }
    }

    clearAllBtn.onclick = () => {
        if (!confirm("Are you sure you want to wipe ALL chat history? This cannot be undone.")) return;
        allChats = {};
        save();
        startNewChat();
    };

    function startNewChat() {
        currentChatId = Date.now().toString();
        allChats[currentChatId] = { title: "New Conversation", history: [] };
        save();
        loadChat(currentChatId);
    }

    function loadChat(id) {
        currentChatId = id;
        chatContainer.innerHTML = '';
        chatTitle.textContent = allChats[id].title;
        allChats[id].history.forEach(m => appendToUI(m.role, m.text));
        renderSidebar();
    }

    function appendToUI(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return msgDiv;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || !session) return;

        allChats[currentChatId].history.push({ role: 'user', text });
        appendToUI('user', text);
        userInput.value = '';

        const aiMsgDiv = appendToUI('ai', '...');
        
        try {
            const context = allChats[currentChatId].history.slice(-7, -1).map(m => `${m.role}: ${m.text}`).join("\n");
            const stream = session.promptStreaming(`${context}\nuser: ${text}\nai:`);
            
            let fullAiText = "";
            for await (const chunk of stream) {
                fullAiText = chunk.startsWith(fullAiText) ? chunk : fullAiText + chunk;
                aiMsgDiv.textContent = fullAiText;
            }

            allChats[currentChatId].history.push({ role: 'ai', text: fullAiText });
            
            if (allChats[currentChatId].title === "New Conversation") {
                const title = await session.prompt(`Summarize this query into a 3-word title: ${text}`);
                allChats[currentChatId].title = title.replace(/"/g, '').trim();
                chatTitle.textContent = allChats[currentChatId].title;
            }
            save();
            renderSidebar();
        } catch (e) { aiMsgDiv.textContent = "Error: " + e.message; }
    }

    function save() { localStorage.setItem('gemini_sessions', JSON.stringify(allChats)); }

    exportBtn.onclick = () => {
        const history = allChats[currentChatId].history;
        const textContent = history.map(m => `${m.role.toUpperCase()}: ${m.text}`).join('\n\n---\n\n');
        const blob = new Blob([textContent], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Chat_${allChats[currentChatId].title.replace(/\s+/g, '_')}.txt`;
        a.click();
    };

    document.getElementById('new-chat-btn').onclick = startNewChat;
    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    init();
</script>
</body>
</html>
