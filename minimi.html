<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Gemini Nano Chat</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .ai { align-self: flex-start; background: #e9e9eb; color: #333; white-space: pre-wrap; }
        #input-area { padding: 20px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #34a853; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message ai">Hello! I am Gemini Nano. Your local session is active and ready to chat.</div>
</div>

<div id="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
</div>

<script>
    let session;
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Initialize the session on load
    async function init() {
        try {
            // Using the global that worked for you in the console
            session = await LanguageModel.create({
                systemPrompt: "You are a helpful local AI assistant.",
                expectedValue: { outputLanguage: 'en' }
            });
        } catch (e) {
            appendMessage('ai', "Error: Could not connect to Gemini Nano. Make sure flags are enabled and the model is downloaded.");
            console.error(e);
        }
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return msgDiv;
    }

    async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || !session) return;

    appendMessage('user', text);
    userInput.value = '';
    sendBtn.disabled = true;

    // Create the bubble and an empty span inside it to hold the growing text
    const aiMsgDiv = appendMessage('ai', '');
    const textNode = document.createElement('span');
    aiMsgDiv.appendChild(textNode);
    
    try {
        const stream = session.promptStreaming(text);
        let lastLength = 0;

        for await (const chunk of stream) {
            // Some versions of Nano return the FULL string every time.
            // This logic handles both: it only appends what is NEW.
            const newText = chunk.startsWith(textNode.textContent) 
                            ? chunk.slice(textNode.textContent.length) 
                            : chunk;
            
            textNode.textContent += newText;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    } catch (e) {
        textNode.textContent = "Error: " + e.message;
    } finally {
        sendBtn.disabled = false;
    }
}

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    init();
</script>

</body>
</html>
